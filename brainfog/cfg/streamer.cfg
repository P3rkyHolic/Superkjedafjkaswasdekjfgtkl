alias streamer_on "cl_hud_minmode 1; hud_saytext_time 0; cl_hud_killstreak_display_time 0; tf_hud_target_id_show_avatars 0; cl_spraydisable 1; cl_notifications_show_ingame 0; tf_spec_xray_disable 1; echo [brainfog] STREAMER MODE ON; alias streamer_toggle streamer_off"
alias streamer_off "cl_hud_minmode 0; hud_saytext_time 12; cl_hud_killstreak_display_time 3; tf_hud_target_id_show_avatars 2; cl_spraydisable 0; cl_notifications_show_ingame 1; tf_spec_xray_disable 0; echo [brainfog] STREAMER MODE OFF; alias streamer_toggle streamer_on"

alias streamer_toggle "streamer_on"
streamer_toggle