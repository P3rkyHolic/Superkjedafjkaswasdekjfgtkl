alias console_unlog "con_logfile console.log"
alias bf_layout_clear "sixense_clear_bindings; sixense_write_bindings bf_layout_stream.txt"
alias bf_layout_on "bf_layout_clear; con_logfile cfg/bf_layout_stream.txt; echo #base ../custom/brainfog/streamer/hudlayout_base.res; console_unlog"

alias streamer_on "bf_layout_on; hud_reloadscheme; alias streamer_toggle streamer_off"
alias streamer_off "bf_layout_clear; hud_reloadscheme; alias streamer_toggle streamer_on"
alias streamer_toggle streamer_on

cl_crosshaircolor 5
cl_crosshair_file""
crosshair 1
