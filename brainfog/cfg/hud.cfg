// ENGINE

vgui_cache_res_files 0									// FOR ACCURATE RELOADING RESULTS

// FIX CONSOLE SPAM

alias dimmer_clicked ""
alias close ""

// DAMAGE NUMBER COLORS

hud_combattext_blue 255
hud_combattext_green 255
hud_combattext_red 255

// VTF CROSSHAIR (FOR WEAPON LABELS)

crosshair 1
cl_crosshair_blue 255									// must be at 255 in order to show full colors
cl_crosshair_file ""
cl_crosshair_green 255									// must be at 255 in order to show full colors
cl_crosshair_red 255									// must be at 255 in order to show full colors
cl_crosshair_scale 16									// 1080p value
cl_crosshairalpha 255
cl_crosshaircolor 5

// HALLOWEEN
tf_forced_holiday 2

// DISABLE MATCH HUD
tf_use_match_hud 0

// DISABLE PLAYER MODEL
cl_hud_playerclass_use_playermodel 0